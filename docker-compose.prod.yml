# Production stack for all Bookforge landing sites.
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# Stripe account keys live in ./.env.stripe (shared). Each site .env holds
# site-specific values including STRIPE_WEBHOOK_SECRET.

x-landing-service: &landing-service
  restart: unless-stopped
  build:
    context: .
    dockerfile: docker/Dockerfile
  networks:
    - landing
  dns:
    - 1.1.1.1
    - 8.8.8.8

services:
  lost-american-memories:
    <<: *landing-service
    container_name: landing-lost-american-memories
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SITE_DIR: lost-american-memories
    env_file:
      - ./.env.stripe
      - ./lost-american-memories/.env
    ports:
      - "127.0.0.1:3001:3000"

  stop-wasting-stuff:
