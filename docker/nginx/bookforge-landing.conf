# Bookforge landing pages — reverse proxy to Docker containers on 127.0.0.1:3001-3011.
# TLS: all domains below are certbot-managed (see ssl_certificate paths under
# /etc/letsencrypt/live/<domain>/). This file is kept in sync with the live
# /etc/nginx/sites-enabled/bookforge-landing so that re-running
# scripts/deploy-nginx-sites.sh never reverts a domain's real cert back to the
# placeholder self-signed one. After running certbot for a domain (new or
# renewed), re-copy the live file back here:
#   sudo cat /etc/nginx/sites-enabled/bookforge-landing > docker/nginx/bookforge-landing.conf
# Do NOT hand-edit ssl_certificate/ssl_certificate_key lines for a domain
# certbot already manages.

# lostamericanmemories.com
server {
    if ($host = www.lostamericanmemories.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = lostamericanmemories.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name lostamericanmemories.com www.lostamericanmemories.com;
    return 301 https://$host$request_uri;




}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lostamericanmemories.com www.lostamericanmemories.com;
    ssl_certificate /etc/letsencrypt/live/lostamericanmemories.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lostamericanmemories.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }


}


