# Bookforge landing pages — reverse proxy to Docker containers on 127.0.0.1:3001-3008.
# TLS: self-signed until scripts/issue-letsencrypt-certs.sh is run after DNS attach.

# lostamericanmemories.com
server {
    listen 80;
    listen [::]:80;
    server_name lostamericanmemories.com www.lostamericanmemories.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lostamericanmemories.com www.lostamericanmemories.com;

    ssl_certificate /etc/nginx/ssl/bookforge-landing/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/bookforge-landing/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}


