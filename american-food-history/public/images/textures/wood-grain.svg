<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200">
  <defs>
    <linearGradient id="wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6b4a35"/>
      <stop offset="50%" style="stop-color:#5c3d2e"/>
      <stop offset="100%" style="stop-color:#4a3025"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.8" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0.3"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="400" height="200" fill="url(#wood)"/>
  <rect width="400" height="200" filter="url(#grain)" opacity="0.4"/>
</svg>
